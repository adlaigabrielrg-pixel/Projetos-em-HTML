<!DOCTYPE html>
<html lang="pt-Br">
<head>
    <meta charset="UTF-8">
    <meta name=" viewport" content ="width= device- width, initial-scale=1.0">
    <title> Solicitação de Produto </title>
<link rel="stylesheet" href="estilo.css">
</head>

<body>

<div class="cotainer">

    <h1> Solicitação de Produto </h1>

    <form action="processar.php" method="post" onsubmit = "return validar()">
        <label for="nome"> Nome do cliente: </label>
        <input type ="text" id="nome" name=" nome">

        <label for="email"> E-mail :</label>
        <input type="email" id="email" name="email" required>

        <label for="produto">Produto Desejado: </label>
<select id="produto" name="produto"required>

    <option value="">-- Selecione um produto --</option>
    <option value="Netebook">       Notebook          </option>
    <option value="Smartphone">     Smartphone        </option>
    <option value="Fone de Ouvido"> Fone de Ouvido    </option>
    <option value="Teclado Mecânico">Teclado Mecânico </option>
</select>

        <label for="quantidade">Quantidade :</label>
        <input type="number"id="quantidade" name="quantidade" min="1" required>

        <label for="idade">Idade :</label>
        <input type="number"id="idade" name="idade" min="0" required>

        <button type ="submit" >Enviar Solicitação </button>
    </form>
</div>

<script>
    function valiadar(){
        let nome = document.getElementById("nome"). value;

        //verifica se o nome esta vazio ou contem apenas espaços
        if (nome.trim() === "") {
            alert("por favor, informe o seu nome antes de enviar!");
            document.getElementById("nome").focus();
            return false; //Impede o envio do formulario
        }
        return true; // Permite o envio
    }
</script>

</body>
</html>
